<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="438" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <g stroke="#e5e7eb" stroke-width="2">
    <line x1="240" y1="16" x2="240" y2="424"/>
    <line x1="480" y1="16" x2="480" y2="424"/>
    <line x1="16" y1="220" x2="704" y2="220"/>
  </g>

  <!-- 1. Резистор -->
  <g transform="translate(0,0)">
    <text x="120" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Резистор · R</text>
    <g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="40" y1="115" x2="80" y2="115"/>
      <rect x="80" y="100" width="80" height="30" rx="2"/>
      <line x1="160" y1="115" x2="200" y2="115"/>
    </g>
    <text x="120" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">R1</text>
    <text x="120" y="155" text-anchor="middle" font-size="15" fill="#2563eb">220 Ом</text>
    <text x="120" y="194" text-anchor="middle" font-size="15" fill="#6b7280">обмежує струм</text>
  </g>

  <!-- 2. Конденсатор -->
  <g transform="translate(240,0)">
    <text x="120" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Конденсатор · C</text>
    <g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="40" y1="115" x2="111" y2="115"/>
      <line x1="111" y1="88" x2="111" y2="142"/>
      <line x1="129" y1="88" x2="129" y2="142"/>
      <line x1="129" y1="115" x2="200" y2="115"/>
    </g>
    <text x="80" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">C1</text>
    <text x="120" y="165" text-anchor="middle" font-size="15" fill="#2563eb">100 nF</text>
    <text x="120" y="194" text-anchor="middle" font-size="15" fill="#6b7280">накопичує заряд</text>
  </g>

  <!-- 3. Світлодіод -->
  <g transform="translate(480,0)">
    <text x="120" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Світлодіод · LED</text>
    <g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="30" y1="120" x2="98" y2="120"/>
      <polygon points="98,98 98,142 136,120"/>
      <line x1="136" y1="98" x2="136" y2="142"/>
      <line x1="136" y1="120" x2="210" y2="120"/>
    </g>
    <g stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="122" y1="92" x2="138" y2="76"/><polyline points="129,76 138,76 138,85"/>
      <line x1="136" y1="98" x2="152" y2="82"/><polyline points="143,82 152,82 152,91"/>
    </g>
    <text x="64" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">A (+)</text>
    <text x="176" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">K (−)</text>
    <text x="120" y="194" text-anchor="middle" font-size="15" fill="#6b7280">струм лише A → K</text>
  </g>

  <!-- 4. Кнопка -->
  <g transform="translate(0,220)">
    <text x="120" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Кнопка · SB</text>
    <g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="40" y1="120" x2="88" y2="120"/>
      <line x1="88" y1="120" x2="148" y2="96"/>
      <line x1="152" y1="120" x2="200" y2="120"/>
      <line x1="120" y1="104" x2="120" y2="78"/>
      <line x1="108" y1="78" x2="132" y2="78"/>
    </g>
    <circle cx="88" cy="120" r="4" fill="#1f2937"/>
    <circle cx="152" cy="120" r="4" fill="#1f2937"/>
    <text x="120" y="194" text-anchor="middle" font-size="15" fill="#6b7280">натиснув — коло замкнуте</text>
  </g>

  <!-- 5. Живлення -->
  <g transform="translate(240,220)">
    <text x="120" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Живлення · VCC</text>
    <g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="120" y1="160" x2="120" y2="100"/>
      <line x1="96" y1="100" x2="144" y2="100"/>
    </g>
    <text x="120" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">+5 V</text>
    <text x="120" y="194" text-anchor="middle" font-size="15" fill="#6b7280">«плюс» схеми</text>
  </g>

  <!-- 6. Земля -->
  <g transform="translate(480,220)">
    <text x="120" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Земля · GND</text>
    <g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="120" y1="72" x2="120" y2="118"/>
      <line x1="94" y1="118" x2="146" y2="118"/>
      <line x1="104" y1="128" x2="136" y2="128"/>
      <line x1="114" y1="138" x2="126" y2="138"/>
    </g>
    <text x="120" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">0 V</text>
    <text x="120" y="194" text-anchor="middle" font-size="15" fill="#6b7280">«мінус» схеми</text>
  </g>
</svg>
